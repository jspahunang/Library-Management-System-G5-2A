<div class="page-section borrow-history-page">
  <header class="page-header-block flex flex-col sm:flex-row justify-between sm:items-end mb-6">
    <div>
      <h2 class="page-title">Borrow history</h2>
      <p class="page-subtitle">Your past and present library borrows. You have {{ activeCount() }} active borrow(s).</p>
    </div>
  </header>

  <div class="card p-0 overflow-hidden">
    <p-table [value]="records()" styleClass="p-datatable-striped" responsiveLayout="scroll">
      <ng-template pTemplate="header">
        <tr>
          <th>Book Title</th>
          <th>Borrow ID</th>
          <th>Borrow Date</th>
          <th>Due Date</th>
          <th>Return Date</th>
          <th>Status</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-r>
        <tr>
          <td class="font-medium text-primary">{{ r.booktitle }}</td>
          <td class="text-sm text-muted break-all">{{ r.borrowid }}</td>
          <td>{{ r.borrowdate }}</td>
          <td>{{ r.duedate }}</td>
          <td>{{ r.returndate || '—' }}</td>
          <td>
            <app-status-badge [status]="r.status" type="borrow" />
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="6" class="text-center py-8">
            <div class="empty-state">
              <span class="empty-icon text-4xl mb-4 block" aria-hidden="true">📖</span>
              <p class="text-muted">You haven't borrowed any books yet.</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
